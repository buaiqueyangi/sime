id: rule.win.credential-dumping-lsa
name: LSASS 内存访问（凭证转储）
version: "1.0"
status: stable
author: sime-core
domain: it
category: host-security
tactics: ["TA0006 凭证访问"]
techniques: ["T1003.001 LSASS 内存"]
severity: critical
detection:
  source: adapter.generic.sysmon
  window: 1m
  group_by: ["dst.asset_id"]
  condition: "event.code == '10' and (event.name matches '(?i)lsass' or process.name matches '(?i)lsass\\.exe')"
  except: "process.name in ('csrss.exe','smss.exe','winlogon.exe','lsass.exe')"
response:
  default: ["isolate.host(dst.asset_id)", "ticket.create(sla=5m)", "notify.sec_team"]
triage: >
  非系统进程访问 LSASS 内存 = 凭证转储（Mimikatz 类工具标志）：立即隔离
  主机并重置该机所有本地/域凭据；排查同网段其他主机是否被同类工具扫描。
references:
  - https://attack.mitre.org/techniques/T1003/001/
