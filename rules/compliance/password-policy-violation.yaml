id: rule.cp.password-policy-violation
name: 弱密码策略账户创建（等保-身份鉴别）
version: "1.0"
status: stable
author: sime-core
domain: it
category: compliance
tactics: ["TA0003 权限维持"]
techniques: ["T1136 创建账户"]
severity: medium
detection:
  source: event.security.auth
  window: 1m
  group_by: ["dst.asset_id"]
  condition: "event.name in ('account_create','user_add') and (user.password_length != '' and user.password_length < 8 or user.password_complexity == 'low')"
response:
  default: ["ticket.create", "notify.sec_team"]
triage: >
  等保身份鉴别要求密码长度 ≥8 且包含大小写+数字+特殊字符：新创建账户
  不满足策略时通知运维强制改密；同时检查既有账户是否有弱密码（结合
  密码审计工具周期性扫描）。
references:
  - GB/T 22239-2019 8.1.4.1 身份鉴别
  - https://attack.mitre.org/techniques/T1136/
