id: rule.host.linux-auditd-passwd-write
name: 审计捕获 /etc/passwd|shadow 直写
version: "1.0"
status: stable
author: sime-core
domain: it
category: host-security
tactics: ["TA0003 持久化"]
techniques: ["T1098 账户操作", "T1098.002 附加凭证"]
severity: critical
detection:
  source: event.security.hids
  window: 1m
  group_by: ["dst.asset_id"]
  condition: "event.name in ('audit_path','audit_syscall') and file.path matches '^/etc/(passwd|shadow|group)$'"
  except: "process.name in ('useradd','usermod','groupadd','passwd','chpasswd','vipw','vigr','userdel')"
response:
  default: ["isolate.host(dst.asset_id)", "ticket.create(sla=5m)", "notify.sec_team"]
triage: >
  绕过账户管理工具直写 passwd/shadow 是创建幽灵账户/写死 root 哈希的
  典型手法（bypass useradd）：核对写入进程 ancestry 与新增行；
  确认恶意后立即隔离主机，比对全部账户的最后修改时间。
references:
  - https://attack.mitre.org/techniques/T1098/
