id: rule.host.account-created-offhours
name: 非工作时间新建账户
version: "1.0"
status: stable
author: sime-core
domain: it
category: identity
tactics: ["TA0003 权限维持"]
techniques: ["T1136 创建账户"]
severity: medium
detection:
  source: event.security.auth
  window: 1m
  group_by: ["dst.asset_id"]
  condition: "event.name in ('account_create','user_add') and not time.in_shift(dst.asset.labels.shift)"
  except: "user.name matches '(?i)^(ansible|deploy|jenkins)$'"
response:
  default: ["ticket.create", "notify.sec_team"]
triage: >
  新建账户为常见持久化手段：核对工单与变更窗口；确认计划内后补充资产台账，
  非计划内账户立即禁用并审查其登录与权限记录。
references:
  - https://attack.mitre.org/techniques/T1136/
