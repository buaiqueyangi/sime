id: rule.container.docker-socket-mount
name: Docker Socket 挂载进容器
version: "1.0"
status: stable
author: sime-core
domain: it
category: container
tactics: ["TA0004 权限提升"]
techniques: ["T1053.007 容器和服务部署"]
severity: critical
detection:
  source: event.security.hids
  window: 1m
  group_by: ["dst.asset_id"]
  condition: "event.category == 'container' and (process.command_line matches '.*docker\\.sock.*' or event.name == 'docker_socket_mount')"
response:
  default: ["ticket.create(sla=5m)", "notify.sec_team", "notify.owner(dst.asset_id)"]
triage: >
  挂载 docker.sock 等于交出宿主机 root：立即停止对应容器并审查启动者；
  CI/CD 之外的 docker.sock 挂载一律按高危事件处置，检查宿主机是否已有
  逃逸痕迹（新容器、cron、SSH 公钥）。
references:
  - https://attack.mitre.org/techniques/T1610/
