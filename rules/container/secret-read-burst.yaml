id: rule.container.secret-read-burst
name: K8s Secret 批量读取
version: "1.0"
status: stable
author: sime-core
domain: it
category: container
tactics: ["TA0006 凭证访问"]
techniques: ["T1552.007 容器 API 凭证"]
severity: critical
detection:
  source: adapter.k8s.audit
  window: 10m
  group_by: ["user.name"]
  threshold: { secret_reads: 10 }
  condition: "event.category == 'k8s-audit' and verb == 'get' and object.type == 'secrets' and count() >= 10"
  except: "user.name matches '(?i)(system:|kube-scheduler|kube-controller)'"
response:
  default: ["ticket.create(sla=15m)", "notify.sec_team"]
  escalate:
    - when: "count() >= 30"
      do: ["isolate.host(src.asset_id)"]
triage: >
  批量读取 K8s Secret 是容器凭证窃取的核心行为（DB 密码/API Key/证书/
  ServiceAccount Token 全在 Secret 中）：立即吊销该 ServiceAccount 的
  Token 并审计其历史操作；确认是否已使用泄露的凭证连接外部服务。
references:
  - https://attack.mitre.org/techniques/T1552/007/
