id: rule.container.new-serviceaccount-token
name: 新建 ServiceAccount Token
version: "1.0"
status: stable
author: sime-core
domain: it
category: container
tactics: ["TA0003 权限维持"]
techniques: ["T1098 账户操作"]
severity: high
detection:
  source: adapter.k8s.audit
  window: 5m
  group_by: ["user.name"]
  condition: "event.category == 'k8s-audit' and object.type == 'serviceaccounts/token' and verb in ('create','token')"
  except: "user.name matches '(?i)(system:|deploy|ci-cd)'"
response:
  default: ["ticket.create(sla=15m)", "notify.sec_team"]
triage: >
  手动创建 ServiceAccount Token 是 K8s 经典持久化手法（Token 不会自动
  过期）：提取 Token 的 SA 权限范围评估影响面；非计划内 Token 立即吊销
  并审查创建者是否已利用该 Token 执行 API 操作。
references:
  - https://attack.mitre.org/techniques/T1098/
