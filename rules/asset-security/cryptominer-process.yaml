id: rule.asset.cryptominer-process
name: 资产清单发现疑似挖矿进程
version: "1.0"
status: stable
author: sime-core
domain: it
category: host-security
tactics: ["TA0110 影响（ICS）", "TA0006 凭证访问"]
techniques: ["T1496 资源劫持"]
severity: critical
detection:
  source: agent.inventory
  window: 10m
  group_by: ["dst.asset_id"]
  condition: "process.name matches '(?i)(xmrig|cpuminer|minerd|cryptominer|kinsing|kdevtmpfsi)' or process.command_line matches '(?i)stratum\\+tcp'"
response:
  default: ["process.kill(process.name)", "isolate.host(dst.asset_id)", "ticket.create(sla=5m)", "notify.sec_team"]
triage: >
  平台对 Agent 上报的资产清单做周期核对，进程名/命令行命中挖矿特征
  （xmrig/cpuminer 等黑名单，可在 config 表 asset.banned_processes 调整）：
  先用 详情中的命令行 区分合法场景（如研发编译），确认后终止进程并隔离主机，
  回溯该主机的登录与计划任务定位入侵入口。
references:
  - https://attack.mitre.org/techniques/T1496/
