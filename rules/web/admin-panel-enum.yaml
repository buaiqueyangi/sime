id: rule.web.admin-panel-enum
name: 管理后台枚举探测
version: "1.0"
status: stable
author: sime-core
domain: it
category: web
tactics: ["TA0007 发现"]
techniques: ["T1087 账户发现"]
severity: low
detection:
  source: adapter.generic.nginx-access
  window: 10m
  group_by: ["src.ip"]
  threshold: { admin_probes: 15 }
  condition: "url.path matches '(?i)^/(admin|manager|phpmyadmin|wp-admin|console|dashboard)' and count() >= 15"
response:
  default: ["notify.sec_team"]
  escalate:
    - when: "count() >= 40"
      do: ["firewall.block(src.ip, ttl=12h)"]
triage: >
  后台路径枚举为针对性入侵准备：低危先观察画像；对登录页 POST 失败集中
  的源升级封禁。比对扫描器指纹排除授权漏扫。
references:
  - https://attack.mitre.org/techniques/T1087/
