id: rule.web.angular-expression-injection
name: Angular 表达式注入
version: "1.0"
status: stable
author: sime-core
domain: it
category: web
tactics: ["TA0001 初始访问"]
techniques: ["T1190 利用面向公众的应用程序"]
severity: high
detection:
  source: adapter.safeline.waf
  window: 5m
  group_by: ["src.ip"]
  threshold: { angular_probes: 3 }
  condition: "url.query matches '(?i).*({{.*}}|ng-model|ng-bind|ng-include).*' and count() >= 3"
response:
  default: ["firewall.block(src.ip, ttl=24h)", "ticket.create"]
triage: >
  Angular 模板表达式注入（{{constructor.constructor('...')()}}）可在前端
  执行任意 JS 并窃取会话：封禁源 IP，通知研发启用 Angular CSP 模式
  （ngCsp）并对用户输入做模板转义。
references:
  - https://attack.mitre.org/techniques/T1190/
