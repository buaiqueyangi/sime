id: rule.web.nosql-injection
name: NoSQL 注入（MongoDB 操作符）
version: "1.0"
status: stable
author: sime-core
domain: it
category: web
tactics: ["TA0001 初始访问"]
techniques: ["T1190 利用面向公众的应用程序"]
severity: high
detection:
  source: adapter.safeline.waf
  window: 5m
  group_by: ["src.ip"]
  threshold: { nosql_probes: 3 }
  condition: "url.query matches '(?i)(\\$ne|\\$gt|\\$where|\\$regex|\\$or).*' or http.request.body.content matches '(?i)(\\$ne|\\$gt|\\$where|\\$or)'"
response:
  default: ["firewall.block(src.ip, ttl=24h)", "ticket.create"]
triage: >
  MongoDB $ne/$gt/$where 操作符注入可绕过登录或枚举数据：封禁源 IP，
  通知研发对 NoSQL 查询参数做白名单校验（禁止操作符直传）。
references:
  - https://attack.mitre.org/techniques/T1190/
